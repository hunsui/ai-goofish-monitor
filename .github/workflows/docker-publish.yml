name: Build & Publish Docker Image

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: ai-xianyu-monitor
  # 承接仓库 Secrets；未配置时为空字符串，DockerHub 步骤会自动跳过
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io：使用内置 GITHUB_TOKEN，无需任何额外配置
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (ghcr.io)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # DockerHub：需仓库 Secrets 中已配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
      - name: Push to DockerHub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          SRC="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          docker pull "${SRC}:latest"
          docker tag "${SRC}:latest" "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"
          docker tag "${SRC}:latest" "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${SHORT_SHA}"
          docker push "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"
          docker push "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${SHORT_SHA}"
